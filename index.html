<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神奈川地理クイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-screen { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

<header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto max-w-2xl flex items-center justify-between gap-3 min-h-[60px]">
            <!-- 左側のY-TECロゴ -->
            <div class="flex-shrink-0">
                <img src="./images/y-tec-logo.jpg" alt="Y-TEC Logo" class="h-14 md:h-20 w-auto rounded-lg shadow-sm border border-blue-400 bg-white p-1">
            </div>
            
            <!-- 右側のタイトル（スマホでは文字を少し小さく、左寄せに） -->
            <div class="flex-grow text-left md:text-center">
                <h1 class="text-lg sm:text-xl md:text-2xl font-bold leading-tight">神奈川ナビゲーション・クエスト</h1>
                <p class="text-[10px] sm:text-xs md:text-sm opacity-90 mt-1 leading-snug">あなたの地理力をテスト！神奈川完全制覇への道</p>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto max-w-2xl p-4 mt-6">

        <!-- ① スタート画面 -->
        <div id="start-screen" class="bg-white rounded-xl shadow-lg p-6 md:p-8 fade-in">
            <h2 class="text-xl font-bold mb-6 text-center border-b pb-3">出題条件の設定</h2>
            
            <div class="space-y-6 mb-8">
                <!-- 1. 交通圏選択 -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">① 交通圏（エリア）</label>
                    <div class="grid grid-cols-2 gap-2" id="region-btn-group">
                        <button type="button" data-value="all" class="opt-btn region-btn active border rounded-lg py-2.5 px-3 text-sm transition">指定なし</button>
                        <button type="button" data-value="京浜交通圏" class="opt-btn region-btn border rounded-lg py-2.5 px-3 text-sm transition">京浜交通圏</button>
                        <button type="button" data-value="県央交通圏" class="opt-btn region-btn border rounded-lg py-2.5 px-3 text-sm transition">県央交通圏</button>
                        <button type="button" data-value="小田原交通圏" class="opt-btn region-btn border rounded-lg py-2.5 px-3 text-sm transition">小田原交通圏</button>
                    </div>
                </div>

                <!-- 2. ジャンル選択 -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">② ジャンル</label>
                    <div class="grid grid-cols-2 gap-2" id="category-btn-group">
                        <button type="button" data-value="all" class="opt-btn category-btn active border rounded-lg py-2.5 px-3 text-sm transition">指定なし</button>
                        <button type="button" data-value="地名・施設名" class="opt-btn category-btn border rounded-lg py-2.5 px-3 text-sm transition">地名・施設名</button>
                        <button type="button" data-value="交差点名" class="opt-btn category-btn border rounded-lg py-2.5 px-3 text-sm transition">交差点名</button>
                        <button type="button" data-value="駅名・路線名" class="opt-btn category-btn border rounded-lg py-2.5 px-3 text-sm transition">駅名・路線名</button>
                        <button type="button" data-value="道路名" class="opt-btn category-btn border rounded-lg py-2.5 px-3 text-sm transition">道路名</button>
                    </div>
                </div>

                <!-- 3. 難易度選択 -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">③ 難易度</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="difficulty-btn-group">
                        <button type="button" data-value="all" class="opt-btn difficulty-btn active border rounded-lg py-2.5 px-2 text-sm transition">指定なし</button>
                        <button type="button" data-value="easy" class="opt-btn difficulty-btn border rounded-lg py-2.5 px-2 text-sm transition">🌱 やさしい</button>
                        <button type="button" data-value="normal" class="opt-btn difficulty-btn border rounded-lg py-2.5 px-2 text-sm transition">🌿 ふつう</button>
                        <button type="button" data-value="hard" class="opt-btn difficulty-btn border rounded-lg py-2.5 px-2 text-sm transition">🌳 むずかしい</button>
                    </div>
                </div>
            </div>

            <button id="start-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition transform hover:-translate-y-0.5 mb-3">
                問題を読み込み中...
            </button>
            <p id="loading-error-msg" class="text-red-500 text-sm text-center hidden-screen font-bold">
                問題データの読み込みに失敗しました。
            </p>
        </div>

        <!-- ② クイズ出題画面 -->
        <div id="quiz-screen" class="hidden-screen bg-white rounded-xl shadow-lg p-6 md:p-10 fade-in">
            <div class="flex justify-between items-center text-sm font-bold text-gray-500 mb-4 pb-2 border-b">
                <span>問題 <span id="current-question-num" class="text-blue-600 text-lg">1</span> / <span id="total-questions">0</span></span>
                <span>スコア: <span id="current-score" class="text-green-600 text-lg">0</span></span>
            </div>

            <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-6 text-center leading-relaxed"></h2>

            <!-- 地図・画像表示エリア -->
            <div id="media-placeholder" class="w-full h-64 bg-gray-200 rounded-lg flex items-center justify-center mb-6 border-2 border-dashed border-gray-400">
                <span id="placeholder-text" class="text-gray-500 font-medium"></span>
            </div>

            <div id="message-area" class="hidden-screen mb-4 p-3 rounded-lg text-center font-bold"></div>

            <div id="answer-area" class="mb-6">
                <label for="answer-select" class="block text-gray-700 font-medium mb-2">解答を選択：</label>
                <select id="answer-select" class="w-full border border-gray-300 rounded-lg p-3 bg-white text-gray-800 text-lg shadow-sm focus:ring-2 focus:ring-blue-500 appearance-none">
                    <option value="">▼ 選択してください</option>
                </select>
            </div>

            <button id="submit-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                解答する
            </button>
            <button id="next-btn" class="hidden-screen w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                次の問題へ
            </button>
        </div>

        <!-- ③ 結果画面 -->
        <div id="result-screen" class="hidden-screen bg-white rounded-xl shadow-lg p-6 md:p-10 fade-in text-center">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">クイズ結果</h2>
            <div class="mb-8 p-6 bg-blue-50 rounded-lg inline-block w-full">
                <p class="text-gray-600 mb-2">あなたの正解数は...</p>
                <p class="text-4xl font-black text-blue-700">
                    <span id="final-score">0</span> <span class="text-2xl">/</span> <span id="final-total">0</span>
                </p>
                <p id="result-comment" class="mt-4 text-lg font-bold text-gray-800"></p>
            </div>
            <button id="retry-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                条件を変えてもう一度遊ぶ
            </button>
        </div>

    </main>

    <footer class="text-center p-4 mt-8 text-gray-500 text-sm">
        <p>Ｙ-ＴＥＣ 日本交通横浜研修センター作成</p>
    </footer>

<script>
     // ==========================================
        // 【管理者用】公開・非公開ジャンル管理
        // ==========================================
        const ACTIVE_SETTINGS = {
            // ⭕ 現在公開中（ボタンが白色・選択可能）
            regions: [
                '京浜交通圏'
            ],

            categories: [
                '交差点名'
            ],

            difficulties: [
                'normal'
            ],

            // 🔒 非公開・準備中のストック（ボタンがグレー）
            // ※ここにある名前は記録用です。公開したい時は上の各リストへ移動させてください。
            hiddenCategories: [
                '県央交通圏',
                '小田原交通圏',
                '駅名・路線名',
                '地名・施設名',
                '道路名',
                '観光名所・旧跡',
                '高速道路・IC名',
                '河川・橋梁',
                'easy',
                'hard'
            ]
        };
        // ==========================================

        let quizData = []; 
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        let selectedRegion = 'all';
        let selectedCategory = 'all';
        let selectedDifficulty = 'all';

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('loading-error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const retryBtn = document.getElementById('retry-btn');
        
        const questionText = document.getElementById('question-text');
        const answerSelect = document.getElementById('answer-select');
        const messageArea = document.getElementById('message-area');
        
        const currentQuestionNumEl = document.getElementById('current-question-num');
        const totalQuestionsEl = document.getElementById('total-questions');
        const currentScoreEl = document.getElementById('current-score');

        const ACTIVE_CLASSES = ['bg-blue-600', 'text-white', 'font-bold', 'border-blue-600', 'shadow-sm'];
        const INACTIVE_CLASSES = ['bg-white', 'text-gray-700', 'border-gray-300', 'hover:bg-blue-50'];

        function setupButtonGroup(buttons, onChange) {
            buttons.forEach(btn => {
                if (btn.classList.contains('active') && !btn.disabled) {
                    btn.classList.add(...ACTIVE_CLASSES);
                } else if (!btn.disabled) {
                    btn.classList.add(...INACTIVE_CLASSES);
                }

                btn.addEventListener('click', () => {
                    if (btn.disabled) return; 
                    buttons.forEach(b => {
                        if(!b.disabled){
                            b.classList.remove('active', ...ACTIVE_CLASSES);
                            b.classList.add(...INACTIVE_CLASSES);
                        }
                    });
                    btn.classList.remove(...INACTIVE_CLASSES);
                    btn.classList.add('active', ...ACTIVE_CLASSES);
                    onChange(btn.dataset.value);
                });
            });
        }

        // ★管理者設定に基づいてボタンをON/OFFする機能
        function applyAdminSettings() {
            // 交通圏の制御
            document.querySelectorAll('.region-btn').forEach(btn => {
                const val = btn.dataset.value;
                if (val !== 'all' && !ACTIVE_SETTINGS.regions.includes(val)) {
                    btn.disabled = true;
                    btn.classList.remove(...ACTIVE_CLASSES, ...INACTIVE_CLASSES, 'active');
                    btn.title = "現在このエリアは準備中です（非公開）";
                }
            });

            // ジャンルの制御
            document.querySelectorAll('.category-btn').forEach(btn => {
                const val = btn.dataset.value;
                // ※データ側の表記ゆれ（地名）にも対応
                const checkVal = val === '地名・施設名' ? '地名' : val;
                
                if (val !== 'all' && !ACTIVE_SETTINGS.categories.includes(val) && !ACTIVE_SETTINGS.categories.includes(checkVal)) {
                    btn.disabled = true;
                    btn.classList.remove(...ACTIVE_CLASSES, ...INACTIVE_CLASSES, 'active');
                    btn.title = "現在このジャンルは準備中です（非公開）";
                }
            });

            // 難易度の制御
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                const val = btn.dataset.value;
                if (val !== 'all' && !ACTIVE_SETTINGS.difficulties.includes(val)) {
                    btn.disabled = true;
                    btn.classList.remove(...ACTIVE_CLASSES, ...INACTIVE_CLASSES, 'active');
                    btn.title = "現在この難易度は準備中です（非公開）";
                }
            });
        }

        async function loadQuizData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`./questions.json?t=${timestamp}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                quizData = await response.json(); 
                
                // データ読み込み後に管理者設定を適用
                applyAdminSettings();
                
                startBtn.disabled = false;
                startBtn.textContent = 'クイズを開始する';
            } catch (error) {
                console.error("データの読み込みに失敗しました:", error);
                startBtn.textContent = '読み込みエラー';
                errorMsg.classList.remove('hidden-screen');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadQuizData();
            setupButtonGroup(document.querySelectorAll('.region-btn'), val => selectedRegion = val);
            setupButtonGroup(document.querySelectorAll('.category-btn'), val => selectedCategory = val);
            setupButtonGroup(document.querySelectorAll('.difficulty-btn'), val => selectedDifficulty = val);
        });

        function shuffleArray(array) {
            const shuffled = array.slice(); 
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; 
            }
            return shuffled;
        }

        function showScreen(screenToShow) {
            startScreen.classList.add('hidden-screen');
            quizScreen.classList.add('hidden-screen');
            resultScreen.classList.add('hidden-screen');
            screenToShow.classList.remove('hidden-screen');
            screenToShow.classList.remove('fade-in');
            void screenToShow.offsetWidth; 
            screenToShow.classList.add('fade-in');
        }

        function showMessage(msg, isCorrect) {
            messageArea.textContent = msg;
            messageArea.className = 'mb-4 p-3 rounded-lg text-center font-bold ';
            if (isCorrect === true) messageArea.classList.add('bg-green-100', 'text-green-800');
            else if (isCorrect === false) messageArea.classList.add('bg-red-100', 'text-red-800');
            else messageArea.classList.add('bg-yellow-100', 'text-yellow-800');
            messageArea.classList.remove('hidden-screen');
        }

        function hideMessage() {
            messageArea.classList.add('hidden-screen');
        }

        function startQuiz() {
            if (quizData.length === 0) return; 

            let filteredQuestions = quizData.filter(q => {
                const regionMatch = (selectedRegion === 'all' || q.region === selectedRegion);
                const categoryMatch = (selectedCategory === 'all' || q.category === selectedCategory || (selectedCategory === '地名・施設名' && q.category === '地名'));
                const difficultyMatch = (selectedDifficulty === 'all' || q.difficulty === selectedDifficulty);
                return regionMatch && categoryMatch && difficultyMatch;
            });

            if (filteredQuestions.length === 0) {
                alert("選択した条件に該当する問題がありません。条件を変更してください。");
                return;
            }

            currentQuestions = shuffleArray(filteredQuestions);
            currentQuestionIndex = 0;
            score = 0;
            
            totalQuestionsEl.textContent = currentQuestions.length;
            currentScoreEl.textContent = score;
            
            loadQuestion();
            showScreen(quizScreen);
        }

        function loadQuestion() {
            const currentQ = currentQuestions[currentQuestionIndex];
            
            hideMessage();
            submitBtn.classList.remove('hidden-screen');
            nextBtn.classList.add('hidden-screen');
            answerSelect.disabled = false;
            
            currentQuestionNumEl.textContent = currentQuestionIndex + 1;
            questionText.textContent = currentQ.question;
            
            const mediaContainer = document.getElementById('media-placeholder');
            
            if (currentQ.imageUrl) {
                mediaContainer.innerHTML = `<img src="${currentQ.imageUrl}" alt="問題画像" class="w-full h-full object-contain rounded-lg bg-gray-100">`;
                mediaContainer.className = "w-full h-64 md:h-80 rounded-lg mb-6 overflow-hidden shadow-inner border border-gray-300";
            } else if (currentQ.mapEmbedUrl) {
                mediaContainer.innerHTML = `<iframe src="${currentQ.mapEmbedUrl}" width="100%" height="100%" style="border:0; border-radius: 0.5rem;" allowfullscreen="" loading="lazy"></iframe>`;
                mediaContainer.className = "w-full h-64 md:h-80 bg-gray-200 rounded-lg mb-6 overflow-hidden shadow-inner";
            } else {
                mediaContainer.innerHTML = `<span id="placeholder-text" class="text-gray-500 font-medium">${currentQ.placeholderText || '画像がありません'}</span>`;
                mediaContainer.className = "w-full h-64 bg-gray-200 rounded-lg flex items-center justify-center mb-6 border-2 border-dashed border-gray-400";
            }
            
            answerSelect.innerHTML = '<option value="">▼ 選択してください</option>';
            const shuffledOptions = shuffleArray(currentQ.options || []);
            
            shuffledOptions.forEach(option => {
                const optEl = document.createElement('option');
                optEl.value = option;
                optEl.textContent = option;
                answerSelect.appendChild(optEl);
            });
        }

        function checkAnswer() {
            const selectedValue = answerSelect.value;
            if (!selectedValue) {
                showMessage("解答を選択してください！", null);
                return;
            }
            
            const currentQ = currentQuestions[currentQuestionIndex];
            const isCorrect = (selectedValue === currentQ.answer);
            
            answerSelect.disabled = true;
            submitBtn.classList.add('hidden-screen');
            nextBtn.classList.remove('hidden-screen');
            
            if (isCorrect) {
                score++;
                currentScoreEl.textContent = score;
                showMessage("⭕ 正解です！", true);
            } else {
                showMessage(`❌ 残念！正解は「${currentQ.answer}」です。`, false);
            }
        }

        function goToNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-total').textContent = currentQuestions.length;
            
            const commentEl = document.getElementById('result-comment');
            const percentage = score / currentQuestions.length;
            
            if (percentage === 1) {
                commentEl.textContent = "パーフェクト！完璧です！🎉";
                commentEl.className = "mt-4 text-lg font-bold text-red-600";
            } else if (percentage >= 0.5) {
                commentEl.textContent = "素晴らしい成績です！👍";
                commentEl.className = "mt-4 text-lg font-bold text-blue-600";
            } else {
                commentEl.textContent = "復習して再挑戦しよう！💪";
                commentEl.className = "mt-4 text-lg font-bold text-gray-700";
            }
            
            showScreen(resultScreen);
        }

        startBtn.addEventListener('click', startQuiz);
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', goToNext);
        retryBtn.addEventListener('click', () => showScreen(startScreen));
        
        answerSelect.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !submitBtn.classList.contains('hidden-screen')) {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
