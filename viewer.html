<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神奈川地理クイズ - 問題エディタ・管理ビューア</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-6">

    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">🗺️ 問題データ エディタ & ビューア</h1>
            <p class="text-sm text-gray-500 mt-1">表上で問題を直接編集・追加・削除し、JSONを書き出せます</p>
        </div>
        
        <div class="flex flex-wrap items-center gap-3">
            <button id="add-new-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow transition flex items-center gap-1">
                ➕ 新規問題を追加
            </button>
            <button id="export-json-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow transition flex items-center gap-1">
                💾 編集後のJSONをコピー
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">

        <!-- 件数 & 検索・フィルターエリア -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3 text-sm">
                <span class="font-bold text-gray-600">全問題数: <span id="total-count" class="text-blue-600 text-lg font-black">0</span> 件</span>
                <span class="font-bold text-gray-600">表示中: <span id="filtered-count" class="text-blue-600 text-lg font-black">0</span> 件</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- 検索 -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">🔍 検索</label>
                    <input type="text" id="search-input" placeholder="問題文・正解・選択肢で検索..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 交通圏 -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">① 交通圏</label>
                    <select id="region-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="京浜交通圏">京浜交通圏</option>
                        <option value="県央交通圏">県央交通圏</option>
                        <option value="小田原交通圏">小田原交通圏</option>
                    </select>
                </div>

                <!-- ジャンル -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">② ジャンル</label>
                    <select id="category-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="地名・施設名">地名・施設名</option>
                        <option value="交差点名">交差点名</option>
                        <option value="道路名">道路名</option>
                    </select>
                </div>

                <!-- 難易度 -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">③ 難易度</label>
                    <select id="difficulty-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="easy">🌱 やさしい (easy)</option>
                        <option value="normal">🌿 ふつう (normal)</option>
                        <option value="hard">🌳 むずかしい (hard)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- テーブル -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs font-bold border-b border-gray-200">
                            <th class="p-3.5 w-12 text-center">#</th>
                            <th class="p-3.5 min-w-[180px]">問題文</th>
                            <th class="p-3.5 min-w-[110px]">正解</th>
                            <th class="p-3.5 min-w-[200px]">選択肢一覧</th>
                            <th class="p-3.5 whitespace-nowrap">交通圏</th>
                            <th class="p-3.5 whitespace-nowrap">ジャンル</th>
                            <th class="p-3.5 whitespace-nowrap">難易度</th>
                            <th class="p-3.5 text-center whitespace-nowrap">操作・確認</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 text-sm">
                    </tbody>
                </table>
            </div>
            <div id="no-data-msg" class="hidden p-8 text-center text-gray-400 font-bold">
                条件に該当する問題が見つかりません。
            </div>
        </div>

    </main>

    <!-- 編集・追加モーダル -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 my-8 shadow-2xl relative">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-form-title" class="font-bold text-lg text-gray-800">問題の編集</h3>
                <button id="close-edit-modal" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
            </div>

            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-index">

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">問題文</label>
                    <input type="text" id="form-question" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">① 交通圏</label>
                        <select id="form-region" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="京浜交通圏">京浜交通圏</option>
                            <option value="県央交通圏">県央交通圏</option>
                            <option value="小田原交通圏">小田原交通圏</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">② ジャンル</label>
                        <select id="form-category" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="地名・施設名">地名・施設名</option>
                            <option value="交差点名">交差点名</option>
                            <option value="道路名">道路名</option>
                        </select>
                    </div>
                    <div>
