<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神奈川地理クイズ - 問題エディタ・管理ビューア</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-6">

    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">🗺️ 問題データ エディタ & ビューア</h1>
            <p class="text-sm text-gray-500 mt-1">編集したデータをGitHubに自動で上書き保存します</p>
        </div>
        
        <div class="flex flex-wrap items-center gap-3">
            <button id="add-new-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow transition flex items-center gap-1">
                ➕ 新規問題を追加
            </button>
            <button id="auto-save-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow transition flex items-center gap-1">
                ☁️ GitHubに自動保存 (反映)
            </button>
            <button id="reset-token-btn" class="text-gray-400 hover:text-gray-600 px-2 text-xs underline">
                鍵の再設定
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">
        <!-- 件数 & 検索・フィルターエリア -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3 text-sm">
                <span class="font-bold text-gray-600">全問題数: <span id="total-count" class="text-blue-600 text-lg font-black">0</span> 件</span>
                <span class="font-bold text-gray-600">表示中: <span id="filtered-count" class="text-blue-600 text-lg font-black">0</span> 件</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">🔍 検索</label>
                    <input type="text" id="search-input" placeholder="問題文・正解・選択肢で検索..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">① 交通圏</label>
                    <select id="region-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="京浜交通圏">京浜交通圏</option>
                        <option value="県央交通圏">県央交通圏</option>
                        <option value="小田原交通圏">小田原交通圏</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">② ジャンル</label>
                    <select id="category-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="地名・施設名">地名・施設名</option>
                        <option value="交差点名">交差点名</option>
                        <option value="道路名">道路名</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">③ 難易度</label>
                    <select id="difficulty-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="easy">🌱 やさしい (easy)</option>
                        <option value="normal">🌿 ふつう (normal)</option>
                        <option value="hard">🌳 むずかしい (hard)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- テーブル -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs font-bold border-b border-gray-200">
                            <th class="p-3.5 w-12 text-center">#</th>
                            <th class="p-3.5 min-w-[180px]">問題文</th>
                            <th class="p-3.5 min-w-[110px]">正解</th>
                            <th class="p-3.5 min-w-[200px]">選択肢一覧</th>
                            <th class="p-3.5 whitespace-nowrap">交通圏</th>
                            <th class="p-3.5 whitespace-nowrap">ジャンル</th>
                            <th class="p-3.5 whitespace-nowrap">難易度</th>
                            <th class="p-3.5 text-center whitespace-nowrap">操作・確認</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 text-sm"></tbody>
                </table>
            </div>
            <div id="no-data-msg" class="hidden p-8 text-center text-gray-400 font-bold">
                条件に該当する問題が見つかりません。
            </div>
        </div>
    </main>

    <!-- 編集・追加モーダル -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 my-8 shadow-2xl relative">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-form-title" class="font-bold text-lg text-gray-800">問題の編集</h3>
                <button id="close-edit-modal" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
            </div>

            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-index">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">問題文</label>
                    <input type="text" id="form-question" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">① 交通圏</label>
                        <select id="form-region" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="京浜交通圏">京浜交通圏</option>
                            <option value="県央交通圏">県央交通圏</option>
                            <option value="小田原交通圏">小田原交通圏</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">② ジャンル</label>
                        <select id="form-category" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="地名・施設名">地名・施設名</option>
                            <option value="交差点名">交差点名</option>
                            <option value="道路名">道路名</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">③ 難易度</label>
                        <select id="form-difficulty" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="easy">🌱 やさしい (easy)</option>
                            <option value="normal">🌿 ふつう (normal)</option>
                            <option value="hard">🌳 むずかしい (hard)</option>
                        </select>
                    </div>
                </div>

                <div class="p-3 bg-gray-50 border rounded-lg space-y-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">選択肢（4つに入力し、正解と同じ文字列を「正解」項目に設定）</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="form-opt-0" required placeholder="選択肢 1" class="border rounded p-2 text-sm">
                        <input type="text" id="form-opt-1" required placeholder="選択肢 2" class="border rounded p-2 text-sm">
                        <input type="text" id="form-opt-2" required placeholder="選択肢 3" class="border rounded p-2 text-sm">
                        <input type="text" id="form-opt-3" required placeholder="選択肢 4" class="border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-green-700 mt-2 mb-1">⭕ 正解（選択肢のどれか1つと完全一致させてください）</label>
                        <input type="text" id="form-answer" required placeholder="例：尾上町" class="w-full border border-green-400 bg-green-50/50 rounded-lg p-2 text-sm font-bold text-green-900">
                    </div>
                </div>

                <div class="p-3 bg-blue-50/50 border border-blue-200 rounded-lg space-y-2">
                    <label class="block text-xs font-bold text-blue-900">🗺️ 地図設定 (任意)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500">緯度・経度 (例: 35.445795, 139.635827)</label>
                            <input type="text" id="form-latlng" placeholder="35.445795, 139.635827" class="w-full border rounded p-1.5 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500">直接埋め込みURL (mapEmbedUrl)</label>
                            <input type="text" id="form-mapurl" placeholder="https://maps.google..." class="w-full border rounded p-1.5 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500">プレースホルダーテキスト</label>
                        <input type="text" id="form-placeholder" placeholder="【地図】" class="w-full border rounded p-1.5 text-xs">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2 border rounded-lg text-sm font-bold hover:bg-gray-100">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold shadow">リストに反映</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 地図モーダル -->
    <div id="map-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full p-4 space-y-3 relative shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-title" class="font-bold text-gray-800"></h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
            </div>
            <div class="w-full h-80 bg-gray-100 rounded-lg overflow-hidden" id="modal-map-container"></div>
        </div>
    </div>

    <script>
        // 【重要設定】あなたのGitHub情報を入力してください
        const GITHUB_USERNAME = "hiroshisimizu-lgtm"; // アカウント名
        const REPO_NAME = "kanagawa-quiz";          // リポジトリ名
        const FILE_PATH = "questions.json";         // 保存先ファイル名

        let allQuestions = [];
        let fileSha = ""; // 上書き保存に必要なファイルのバージョン情報

        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const regionSelect = document.getElementById('region-select');
        const categorySelect = document.getElementById('category-select');
        const difficultySelect = document.getElementById('difficulty-select');
        
        const totalCountEl = document.getElementById('total-count');
        const filteredCountEl = document.getElementById('filtered-count');
        const noDataMsg = document.getElementById('no-data-msg');

        const editModal = document.getElementById('edit-modal');
        const editForm = document.getElementById('edit-form');
        const modalFormTitle = document.getElementById('modal-form-title');
        const editIndexInput = document.getElementById('edit-index');

        const mapModal = document.getElementById('map-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMapContainer = document.getElementById('modal-map-container');

        // 文字列をBase64にエンコードする関数（日本語対応）
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        async function init() {
            try {
                // 最新データの読み込み
                const timestamp = new Date().getTime();
                const response = await fetch(`./${FILE_PATH}?t=${timestamp}`);
                if (!response.ok) throw new Error('読み込み失敗');
                allQuestions = await response.json();
                
                totalCountEl.textContent = allQuestions.length;
                renderTable();
            } catch (error) {
                console.error(error);
            }
        }

        function renderTable() {
            const keyword = searchInput.value.toLowerCase().trim();
            const region = regionSelect.value;
            const category = categorySelect.value;
            const difficulty = difficultySelect.value;

            let displayedCount = 0;
            tableBody.innerHTML = '';

            allQuestions.forEach((q, originalIndex) => {
                const matchKeyword = !keyword || 
                    (q.question && q.question.toLowerCase().includes(keyword)) ||
                    (q.answer && q.answer.toLowerCase().includes(keyword)) ||
                    (q.options && q.options.some(opt => opt.toLowerCase().includes(keyword)));

                const matchRegion = (region === 'all' || q.region === region);
                const matchCategory = (category === 'all' || q.category === category || (category === '地名・施設名' && q.category === '地名'));
                const matchDifficulty = (difficulty === 'all' || q.difficulty === difficulty);

                if (matchKeyword && matchRegion && matchCategory && matchDifficulty) {
                    displayedCount++;
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-blue-50/50 transition";

                    let diffBadge = '';
                    if (q.difficulty === 'easy') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700">やさしい</span>';
                    else if (q.difficulty === 'normal') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-yellow-100 text-yellow-700">ふつう</span>';
                    else if (q.difficulty === 'hard') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700">むずかしい</span>';

                    const optionsHtml = q.options ? q.options.map(opt => {
                        if (opt === q.answer) {
                            return `<span class="inline-block bg-green-100 text-green-800 font-bold px-1.5 py-0.5 rounded border border-green-300">${opt}</span>`;
                        }
                        return `<span class="inline-block bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">${opt}</span>`;
                    }).join(' ') : 'なし';

                    tr.innerHTML = `
                        <td class="p-3.5 text-center font-bold text-gray-400">${displayedCount}</td>
                        <td class="p-3.5 font-bold text-gray-800">${q.question || ''}</td>
                        <td class="p-3.5 font-black text-green-700">${q.answer || ''}</td>
                        <td class="p-3.5 space-y-1">${optionsHtml}</td>
                        <td class="p-3.5 whitespace-nowrap text-xs font-semibold text-gray-600">${q.region || '-'}</td>
                        <td class="p-3.5 whitespace-nowrap text-xs font-semibold text-gray-600">${q.category || '-'}</td>
                        <td class="p-3.5 whitespace-nowrap">${diffBadge}</td>
                        <td class="p-3.5 text-center whitespace-nowrap space-x-1">
                            ${q.mapEmbedUrl ? `<button onclick="openMap('\${q.question} - ${q.answer}', '${q.mapEmbedUrl}')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 text-xs px-2 py-1 rounded font-bold transition">🗺️ 地図</button>` : ''}
                            <button onclick="openEditModal(${originalIndex})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2.5 py-1 rounded font-bold transition">✏️ 編集</button>
                            <button onclick="deleteQuestion(${originalIndex})" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded font-bold transition">🗑️ 削除</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            filteredCountEl.textContent = displayedCount;
            totalCountEl.textContent = allQuestions.length;

            if (displayedCount === 0) {
                noDataMsg.classList.remove('hidden');
            } else {
                noDataMsg.classList.add('hidden');
            }
        }

        window.openEditModal = function(index) {
            const q = allQuestions[index];
            modalFormTitle.textContent = "問題の編集 (#" + (index + 1) + ")";
            editIndexInput.value = index;

            document.getElementById('form-question').value = q.question || '';
            document.getElementById('form-region').value = q.region || '京浜交通圏';
            document.getElementById('form-category').value = q.category === '地名' ? '地名・施設名' : (q.category || '交差点名');
            document.getElementById('form-difficulty').value = q.difficulty || 'normal';

            document.getElementById('form-opt-0').value = q.options ? (q.options[0] || '') : '';
            document.getElementById('form-opt-1').value = q.options ? (q.options[1] || '') : '';
            document.getElementById('form-opt-2').value = q.options ? (q.options[2] || '') : '';
            document.getElementById('form-opt-3').value = q.options ? (q.options[3] || '') : '';
            document.getElementById('form-answer').value = q.answer || '';

            document.getElementById('form-latlng').value = '';
            document.getElementById('form-mapurl').value = q.mapEmbedUrl || '';
            document.getElementById('form-placeholder').value = q.placeholderText || '【地図】';

            editModal.classList.remove('hidden');
        };

        document.getElementById('add-new-btn').addEventListener('click', () => {
            modalFormTitle.textContent = "新規問題の追加";
            editIndexInput.value = "-1";
            editForm.reset();
            document.getElementById('form-placeholder').value = "【地図】";
            document.getElementById('form-region').value = '京浜交通圏';
            document.getElementById('form-category').value = '交差点名';
            document.getElementById('form-difficulty').value = 'normal';
            editModal.classList.remove('hidden');
        });

        window.deleteQuestion = function(index) {
            const q = allQuestions[index];
            if (confirm(`以下の問題を削除しますか？\n\n「${q.question} - 正解: ${q.answer}」\n\n※この時点ではまだ保存されていません。右上の「☁️ 自動保存」ボタンを押すと確定します。`)) {
                allQuestions.splice(index, 1);
                renderTable();
            }
        };

        editForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const idx = parseInt(editIndexInput.value);
            const question = document.getElementById('form-question').value.trim();
            const region = document.getElementById('form-region').value;
            const category = document.getElementById('form-category').value;
            const difficulty = document.getElementById('form-difficulty').value;

            const opts = [
                document.getElementById('form-opt-0').value.trim(),
                document.getElementById('form-opt-1').value.trim(),
                document.getElementById('form-opt-2').value.trim(),
                document.getElementById('form-opt-3').value.trim(),
            ];
            const answer = document.getElementById('form-answer').value.trim();

            if (!opts.includes(answer)) {
                alert("❌ 「正解」に入力した文字列は、選択肢4つのうちいずれか1つと完全一致させてください。");
                return;
            }

            const latlng = document.getElementById('form-latlng').value.trim();
            let mapUrl = document.getElementById('form-mapurl').value.trim();
            const placeholder = document.getElementById('form-placeholder').value.trim();

            if (latlng) {
                const cleanLatLng = latlng.replace(/\s+/g, '');
                mapUrl = `https://maps.google.co.jp/maps?output=embed&q=${cleanLatLng}&t=m&hl=ja&z=17`;
            }

            const item = {
                question: question,
                placeholderText: placeholder || "【地図】",
            };

            if (mapUrl) item.mapEmbedUrl = mapUrl;

            item.options = opts;
            item.answer = answer;
            item.region = region;
            item.category = category;
            item.difficulty = difficulty;

            if (idx >= 0) {
                allQuestions[idx] = item;
            } else {
                allQuestions.unshift(item);
            }

            editModal.classList.add('hidden');
            renderTable();
            
            // ユーザーに自動保存ボタンを押すよう促す
            const autoSaveBtn = document.getElementById('auto-save-btn');
            autoSaveBtn.classList.add('animate-pulse', 'bg-red-500');
            autoSaveBtn.classList.remove('bg-blue-600');
            autoSaveBtn.textContent = '☁️ 変更あり: クリックしてGitHubに保存';
        });

        // ==========================================
        // GitHub API による自動保存機能
        // ==========================================
        document.getElementById('auto-save-btn').addEventListener('click', async () => {
            if (allQuestions.length === 0) {
                alert("問題データがありません。");
                return;
            }

            // 1. 合鍵（トークン）がブラウザに保存されているかチェック
            let token = localStorage.getItem('github_token');
            if (!token) {
                token = prompt("GitHubに自動保存するための「合鍵（Personal Access Token）」を入力してください。\n(ghp_ から始まる文字列)\n※このパスワードはあなたのブラウザ内のみに安全に保存されます。");
                if (!token) return; // キャンセル時
                localStorage.setItem('github_token', token);
            }

            const btn = document.getElementById('auto-save-btn');
            btn.textContent = '⏳ 保存中...';
            btn.disabled = true;

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

            try {
                // 2. 現在のファイルのバージョン情報 (sha) を取得する
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (getRes.status === 401 || getRes.status === 403) {
                    throw new Error("鍵（トークン）が間違っているか、権限がありません。再設定してください。");
                }
                
                let sha = "";
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                // 3. 最新のJSONを Base64 に変換して上書き保存 (PUT)
                const jsonText = JSON.stringify(allQuestions, null, 4);
                const encodedContent = utf8_to_b64(jsonText);

                const putData = {
                    message: "viewer.html から問題を更新・追加しました",
                    content: encodedContent,
                    sha: sha
                };

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putData)
                });

                if (!putRes.ok) {
                    const errObj = await putRes.json();
                    throw new Error(errObj.message || '保存に失敗しました');
                }

                // 成功時の処理
                alert(`✨ 成功！\n全 ${allQuestions.length} 件のデータが GitHub (questions.json) に自動で上書き保存されました。\n\n※実際のクイズ画面に反映されるまで1〜2分かかります。`);
                
                // ボタンを通常状態に戻す
                btn.classList.remove('animate-pulse', 'bg-red-500');
                btn.classList.add('bg-blue-600');
                btn.textContent = '☁️ GitHubに自動保存 (反映)';

            } catch (error) {
                alert(`❌ エラー発生: ${error.message}`);
                // エラーが出た場合、念のためクリップボードにもコピーしておく親切設計
                const jsonText = JSON.stringify(allQuestions, null, 4);
                navigator.clipboard.writeText(jsonText).then(() => {
                    alert("保存に失敗したため、代用としてクリップボードにデータをコピーしました。手動でGitHubに貼り付けて保存してください。");
                });
            } finally {
                btn.disabled = false;
            }
        });

        // トークンをリセットする機能
        document.getElementById('reset-token-btn').addEventListener('click', () => {
            localStorage.removeItem('github_token');
            alert("ブラウザに記憶していた合鍵（トークン）を削除しました。\n次回保存時に再度入力を求められます。");
        });

        // モーダル閉じる
        document.getElementById('cancel-edit-btn').addEventListener('click', () => editModal.classList.add('hidden'));
        document.getElementById('close-edit-modal').addEventListener('click', () => editModal.classList.add('hidden'));

        window.openMap = function(title, url) {
            modalTitle.textContent = title;
            modalMapContainer.innerHTML = `<iframe src="${url}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
            mapModal.classList.remove('hidden');
        };

        document.getElementById('close-modal').addEventListener('click', () => mapModal.classList.add('hidden'));

        [searchInput, regionSelect, categorySelect, difficultySelect].forEach(el => {
            el.addEventListener('input', renderTable);
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
