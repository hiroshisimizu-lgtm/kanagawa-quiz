<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神奈川地理クイズ - 問題管理ビューア</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-6">

    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">🗺️ 問題データ管理・確認ビューア</h1>
            <p class="text-sm text-gray-500 mt-1">questions.json の全データ一覧・確認・検索ツール</p>
        </div>
        <div class="flex items-center gap-4 bg-blue-50 px-4 py-3 rounded-lg border border-blue-100">
            <div class="text-center">
                <p class="text-xs text-blue-600 font-bold">総問題数</p>
                <p id="total-count" class="text-2xl font-black text-blue-700">0</p>
            </div>
            <div class="h-8 w-px bg-blue-200"></div>
            <div class="text-center">
                <p class="text-xs text-blue-600 font-bold">表示中</p>
                <p id="filtered-count" class="text-2xl font-black text-blue-700">0</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">

        <!-- 検索・フィルターエリア -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- キーワード検索 -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">🔍 キーワード検索</label>
                    <input type="text" id="search-input" placeholder="問題文、正解、選択肢で検索..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 交通圏フィルター -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">① 交通圏</label>
                    <select id="region-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="京浜交通圏">京浜交通圏</option>
                        <option value="県央交通圏">県央交通圏</option>
                        <option value="小田原交通圏">小田原交通圏</option>
                    </select>
                </div>

                <!-- ジャンルフィルター -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">② ジャンル</label>
                    <select id="category-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="地名・施設名">地名・施設名</option>
                        <option value="交差点名">交差点名</option>
                        <option value="道路名">道路名</option>
                    </select>
                </div>

                <!-- 難易度フィルター -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">③ 難易度</label>
                    <select id="difficulty-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて表示</option>
                        <option value="easy">🌱 やさしい (easy)</option>
                        <option value="normal">🌿 ふつう (normal)</option>
                        <option value="hard">🌳 むずかしい (hard)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- データテーブル -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs font-bold border-b border-gray-200">
                            <th class="p-3.5 w-12 text-center">#</th>
                            <th class="p-3.5 min-w-[200px]">問題文</th>
                            <th class="p-3.5 min-w-[120px]">正解</th>
                            <th class="p-3.5 min-w-[220px]">選択肢一覧 (4つ)</th>
                            <th class="p-3.5 whitespace-nowrap">交通圏</th>
                            <th class="p-3.5 whitespace-nowrap">ジャンル</th>
                            <th class="p-3.5 whitespace-nowrap">難易度</th>
                            <th class="p-3.5 text-center whitespace-nowrap">地図/プレビュー</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 text-sm">
                        <!-- 動的に挿入されます -->
                    </tbody>
                </table>
            </div>
            <div id="no-data-msg" class="hidden p-8 text-center text-gray-400 font-bold">
                条件に該当する問題が見つかりません。
            </div>
        </div>

    </main>

    <!-- 地図モーダル（ポップアップ表示用） -->
    <div id="map-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full p-4 space-y-3 relative shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-title" class="font-bold text-gray-800"></h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
            </div>
            <div class="w-full h-80 bg-gray-100 rounded-lg overflow-hidden" id="modal-map-container">
                <!-- iframeが動的に入ります -->
            </div>
        </div>
    </div>

    <script>
        let allQuestions = [];

        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const regionSelect = document.getElementById('region-select');
        const categorySelect = document.getElementById('category-select');
        const difficultySelect = document.getElementById('difficulty-select');
        
        const totalCountEl = document.getElementById('total-count');
        const filteredCountEl = document.getElementById('filtered-count');
        const noDataMsg = document.getElementById('no-data-msg');

        const mapModal = document.getElementById('map-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMapContainer = document.getElementById('modal-map-container');
        const closeModal = document.getElementById('close-modal');

        async function init() {
            try {
                const response = await fetch('./questions.json');
                if (!response.ok) throw new Error('読み込み失敗');
                allQuestions = await response.json();
                
                totalCountEl.textContent = allQuestions.length;
                renderTable();
            } catch (error) {
                alert('questions.json の読み込みに失敗しました。');
            }
        }

        function renderTable() {
            const keyword = searchInput.value.toLowerCase().trim();
            const region = regionSelect.value;
            const category = categorySelect.value;
            const difficulty = difficultySelect.value;

            const filtered = allQuestions.filter(q => {
                const matchKeyword = !keyword || 
                    q.question.toLowerCase().includes(keyword) ||
                    q.answer.toLowerCase().includes(keyword) ||
                    (q.options && q.options.some(opt => opt.toLowerCase().includes(keyword)));

                const matchRegion = (region === 'all' || q.region === region);
                const matchCategory = (category === 'all' || q.category === category || (category === '地名・施設名' && q.category === '地名'));
                const matchDifficulty = (difficulty === 'all' || q.difficulty === difficulty);

                return matchKeyword && matchRegion && matchCategory && matchDifficulty;
            });

            filteredCountEl.textContent = filtered.length;
            tableBody.innerHTML = '';

            if (filtered.length === 0) {
                noDataMsg.classList.remove('hidden');
                return;
            } else {
                noDataMsg.classList.add('hidden');
            }

            filtered.forEach((q, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/50 transition";

                // 難易度バッジ
                let diffBadge = '';
                if (q.difficulty === 'easy') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700">やさしい</span>';
                else if (q.difficulty === 'normal') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-yellow-100 text-yellow-700">ふつう</span>';
                else if (q.difficulty === 'hard') diffBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700">むずかしい</span>';

                // 選択肢（正解を太字＋緑ハイライト）
                const optionsHtml = q.options ? q.options.map(opt => {
                    if (opt === q.answer) {
                        return `<span class="inline-block bg-green-100 text-green-800 font-bold px-1.5 py-0.5 rounded border border-green-300">${opt} (正解)</span>`;
                    }
                    return `<span class="inline-block bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">${opt}</span>`;
                }).join(' ') : 'なし';

                tr.innerHTML = `
                    <td class="p-3.5 text-center font-bold text-gray-400">${index + 1}</td>
                    <td class="p-3.5 font-bold text-gray-800">${q.question}</td>
                    <td class="p-3.5 font-black text-green-700">${q.answer}</td>
                    <td class="p-3.5 space-y-1">${optionsHtml}</td>
                    <td class="p-3.5 whitespace-nowrap text-xs font-semibold text-gray-600">${q.region || '-'}</td>
                    <td class="p-3.5 whitespace-nowrap text-xs font-semibold text-gray-600">${q.category || '-'}</td>
                    <td class="p-3.5 whitespace-nowrap">${diffBadge}</td>
                    <td class="p-3.5 text-center whitespace-nowrap">
                        ${q.mapEmbedUrl ? `<button onclick="openMap('\${q.question} - ${q.answer}', '${q.mapEmbedUrl}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1.5 rounded font-bold transition shadow-sm">🗺️ 地図を確認</button>` : '<span class="text-xs text-gray-400">画像/なし</span>'}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function openMap(title, url) {
            modalTitle.textContent = title;
            modalMapContainer.innerHTML = `<iframe src="${url}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
            mapModal.classList.remove('hidden');
        }

        closeModal.addEventListener('click', () => mapModal.classList.add('hidden'));
        mapModal.addEventListener('click', (e) => {
            if (e.target === mapModal) mapModal.classList.add('hidden');
        });

        [searchInput, regionSelect, categorySelect, difficultySelect].forEach(el => {
            el.addEventListener('input', renderTable);
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
