<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>問題JSONジェネレーター</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col p-4">

    <header class="bg-emerald-600 text-white p-4 rounded-xl shadow-md mb-6 max-w-3xl mx-auto w-full text-center">
        <h1 class="text-2xl font-bold">問題JSONジェネレーター</h1>
        <p class="text-sm opacity-90 mt-1">questions.json 用のデータを簡単に作成します</p>
    </header>

    <main class="max-w-3xl mx-auto w-full bg-white rounded-xl shadow-lg p-6 md:p-8 space-y-6">

        <!-- 問題文 -->
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">問題文</label>
            <input type="text" id="question" placeholder="例：この交差点名は？" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- 新設定項目：交通圏・ジャンル・難易度 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-b py-4 bg-emerald-50/50 p-4 rounded-lg">
            <!-- 交通圏 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">① 交通圏</label>
                <select id="region" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-emerald-500">
                    <option value="京浜交通圏">京浜交通圏</option>
                    <option value="県央交通圏">県央交通圏</option>
                    <option value="小田原交通圏">小田原交通圏</option>
                </select>
            </div>

            <!-- ジャンル -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">② ジャンル</label>
                <select id="category" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-emerald-500">
                    <option value="地名">地名</option>
                    <option value="交差点名" selected>交差点名</option>
                    <option value="道路名">道路名</option>
                </select>
            </div>

            <!-- 難易度 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">③ 難易度</label>
                <select id="difficulty" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-emerald-500">
                    <option value="easy">🌱 やさしい</option>
                    <option value="normal" selected>🌿 ふつう</option>
                    <option value="hard">🌳 むずかしい</option>
                </select>
            </div>
        </div>

        <!-- プレースホルダーテキスト -->
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">プレースホルダーテキスト（地図がない場合等の代替テキスト）</label>
            <input type="text" id="placeholderText" placeholder="例：【地図】交差点「尾上町」周辺の地図" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Googleマップ（緯度経度から自動作成 or URL直接貼り付け） -->
        <div class="p-4 border border-blue-200 bg-blue-50/50 rounded-lg space-y-3">
            <label class="block text-sm font-bold text-blue-900">🗺️ Googleマップ埋め込み設定 (任意)</label>
            <p class="text-xs text-blue-700">Googleマップで右クリックしてコピーした「緯度, 経度」を貼るだけで、ラベルの出ない安全な地図URLを自動作成します。</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">緯度・経度 (例: 35.445795, 139.635827)</label>
                    <input type="text" id="latlng" placeholder="35.445795, 139.635827" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">または 埋め込み用URLを直接入力</label>
                    <input type="text" id="mapUrl" placeholder="https://maps.google.co.jp/maps?..." class="w-full border rounded-lg p-2 text-sm">
                </div>
            </div>
        </div>

        <!-- 選択肢 -->
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">選択肢（4つ入力）</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" class="option-input border rounded-lg p-2.5" placeholder="選択肢 1">
                <input type="text" class="option-input border rounded-lg p-2.5" placeholder="選択肢 2">
                <input type="text" class="option-input border rounded-lg p-2.5" placeholder="選択肢 3">
                <input type="text" class="option-input border rounded-lg p-2.5" placeholder="選択肢 4">
            </div>
        </div>

        <!-- 正解 -->
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">正解</label>
            <input type="text" id="answer" placeholder="選択肢の中のどれかと同じ文字列" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- ボタン -->
        <button id="generate-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition">
            JSONデータを生成する
        </button>

        <!-- 出力エリア -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block text-sm font-bold text-gray-700">生成されたJSONデータ</label>
                <button id="copy-btn" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold px-3 py-1 rounded transition">コピーする</button>
            </div>
            <textarea id="output" rows="10" readonly class="w-full border rounded-lg p-3 font-mono text-sm bg-gray-50 focus:outline-none"></textarea>
        </div>

    </main>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const output = document.getElementById('output');

        generateBtn.addEventListener('click', () => {
            const question = document.getElementById('question').value.trim();
            const region = document.getElementById('region').value;
            const category = document.getElementById('category').value;
            const difficulty = document.getElementById('difficulty').value;
            const placeholderText = document.getElementById('placeholderText').value.trim();
            const latlng = document.getElementById('latlng').value.trim();
            const mapUrlInput = document.getElementById('mapUrl').value.trim();
            const answer = document.getElementById('answer').value.trim();

            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs).map(i => i.value.trim()).filter(v => v !== '');

            if (!question || options.length === 0 || !answer) {
                alert('問題文、選択肢、正解を入力してください。');
                return;
            }

            // 地図URLの設定
            let mapEmbedUrl = "";
            if (latlng) {
                const cleanLatLng = latlng.replace(/\s+/g, '');
                mapEmbedUrl = `https://maps.google.co.jp/maps?output=embed&q=${cleanLatLng}&t=m&hl=ja&z=17`;
            } else if (mapUrlInput) {
                mapEmbedUrl = mapUrlInput;
            }

            const item = {
                question: question,
                placeholderText: placeholderText || "【地図】",
            };

            if (mapEmbedUrl) {
                item.mapEmbedUrl = mapEmbedUrl;
            }

            item.options = options;
            item.answer = answer;
            item.region = region;
            item.category = category;
            item.difficulty = difficulty;

            // questions.json に貼り付けやすいよう末尾にカンマ（,）を付与
            output.value = JSON.stringify(item, null, 4) + ",";
        });

        copyBtn.addEventListener('click', () => {
            if (!output.value) return;
            output.select();
            navigator.clipboard.writeText(output.value);
            alert('JSONデータをクリップボードにコピーしました！');
        });
    </script>
</body>
</html>
